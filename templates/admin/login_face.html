{% extends "admin/base.html" %}
{% block page_title %}Scan your face{% endblock %}
{% block admin_main %}
<main class="auth-wrap">
  <section class="auth-card">
    <span class="eyebrow">FIP team access</span>
    <h1>One more step.</h1>
    <p>Scan your face to finish signing in. It must match the face saved on your account.</p>
    <button class="button" type="button" data-flow="login" data-next="/">Scan my face</button>
    {% include "partials/face_camera.html" %}
    <p class="field-hint"><a class="text-link" href="/login">Start over</a></p>
  </section>
</main>
{% endblock %}
